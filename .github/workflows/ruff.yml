name: Ruff
on:
    pull_request:
    push:
        branches:
            - main

jobs:
    ruff:
        name: Run Ruff
        timeout-minutes: 5
        runs-on: ubuntu-latest
        steps:
            - name: Check out the code
              uses: actions/checkout@v6

            - name: Ruff check
              uses: astral-sh/ruff-action@v4.1.0
              with:
                  version-file: uv.lock

            - name: Ruff format check
              uses: astral-sh/ruff-action@v4.1.0
              with:
                  version-file: uv.lock
                  args: "format --check"
